<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Bank of Baroda (Baroda Sun) Brandmark -->
  <defs>
    <linearGradient id="bob-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B1A" />
      <stop offset="100%" stop-color="#E84F00" />
    </linearGradient>
  </defs>
  <!-- Vermilion Orange Rounded Shield -->
  <rect width="100" height="100" rx="20" fill="url(#bob-bg)" />
  
  <!-- "Baroda Sun" Monogram: Dual 'B' with Sunrays in Pure White -->
  <g fill="#FFFFFF">
    <!-- Central Solar Core (Rising Sun Arc) -->
    <circle cx="50" cy="50" r="12" />
    
    <!-- Left Radiating 'B' Wings & Rays -->
    <path d="M 33 28 C 30 33 28 40 28 50 C 28 60 30 67 33 72 C 34 73 34.5 73.5 35 73.5 C 36 73.5 36.5 72.5 36 71 C 33.5 65.5 32 58 32 50 C 32 42 33.5 34.5 36 29 C 36.5 27.5 36 26.5 35 26.5 C 34.5 26.5 34 27 33 28 Z" />
    <path d="M 40 32 C 38 37 36.5 43 36.5 50 C 36.5 57 38 63 40 68 C 40.5 69 41.5 69 42 68 C 42.5 67 42 66 41.5 65 C 40 60.5 39 55.5 39 50 C 39 44.5 40 39.5 41.5 35 C 42 34 42.5 33 42 32 C 41.5 31 40.5 31 40 32 Z" />
    
    <!-- Right Radiating 'B' Wings & Solar Crest -->
    <path d="M 67 28 C 70 33 72 40 72 50 C 72 60 70 67 67 72 C 66 73 65.5 73.5 65 73.5 C 64 73.5 63.5 72.5 64 71 C 66.5 65.5 68 58 68 50 C 68 42 66.5 34.5 64 29 C 63.5 27.5 64 26.5 65 26.5 C 65.5 26.5 66 27 67 28 Z" />
    <path d="M 60 32 C 62 37 63.5 43 63.5 50 C 63.5 57 62 63 60 68 C 59.5 69 58.5 69 58 68 C 57.5 67 58 66 58.5 65 C 60 60.5 61 55.5 61 50 C 61 44.5 60 39.5 58.5 35 C 58 34 57.5 33 58 32 C 58.5 31 59.5 31 60 32 Z" />

    <!-- Top & Bottom Solar Corona Rays -->
    <rect x="47.5" y="20" width="5" height="12" rx="2.5" />
    <rect x="47.5" y="68" width="5" height="12" rx="2.5" />
  </g>
</svg>
