<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Warm Terracotta Gradient matching app primary accent: #E07A5F -->
    <linearGradient id="bg-terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E58268" />
      <stop offset="50%" stop-color="#E07A5F" />
      <stop offset="100%" stop-color="#D0674C" />
    </linearGradient>

    <!-- Sage Green Gradient matching app income & investments: #3E8E68 -->
    <linearGradient id="accent-sage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56B889" />
      <stop offset="100%" stop-color="#3E8E68" />
    </linearGradient>

    <!-- Clean Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#732B18" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Base Squircle Container (Standard iOS & Android Super-ellipse curve) -->
  <rect width="512" height="512" rx="116" fill="url(#bg-terracotta)" />
  
  <!-- Subtle High-End Rim Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="2.5" />

  <!-- Clean, Simple, Modern Financial Emblem -->
  <g filter="url(#shadow)">
    <!-- Top Horizontal Crossbar -->
    <line x1="168" y1="154" x2="344" y2="154" 
          stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" />

    <!-- Second Horizontal Crossbar -->
    <line x1="168" y1="210" x2="304" y2="210" 
          stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" />

    <!-- Rupee Vertical Spine and Smooth Upper Arc -->
    <path d="M 218 154 L 218 266 C 218 266 244 266 276 266 C 316 266 338 240 338 210 C 338 180 316 154 276 154" 
          fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Forward Growth Diagonal Stroke in Fresh Sage Green -->
    <line x1="236" y1="264" x2="340" y2="372" 
          stroke="url(#accent-sage)" stroke-width="28" stroke-linecap="round" />

    <!-- Crisp Outer Accent Ring on Growth Node -->
    <circle cx="340" cy="372" r="14" fill="#FFFFFF" />
    <circle cx="340" cy="372" r="9" fill="url(#accent-sage)" />
  </g>
</svg>
