<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- State Bank of India (SBI) Emblem -->
  <defs>
    <linearGradient id="sbi-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0091DF" />
      <stop offset="100%" stop-color="#0066A2" />
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="50" cy="50" r="48" fill="url(#sbi-grad)" />
  <!-- Center Keyhole Cutout -->
  <!-- Top Circular Opening -->
  <circle cx="50" cy="42" r="15" fill="#FFFFFF" />
  <!-- Bottom Vertical Slot -->
  <rect x="45.5" y="42" width="9" height="42" rx="4.5" fill="#FFFFFF" />
  <!-- Inner Blue Dot Center Pin (Classic detail) -->
  <circle cx="50" cy="42" r="3.5" fill="url(#sbi-grad)" />
</svg>
