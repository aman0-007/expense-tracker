<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: Deep, ultra-refined obsidian-slate gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0F131C" />
      <stop offset="100%" stop-color="#090B10" />
    </linearGradient>

    <!-- Emerald-Teal Primary FinTech Flow Gradient -->
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Warm Terracotta Accent Flow Gradient -->
    <linearGradient id="accent-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F7A" />
      <stop offset="60%" stop-color="#E07A5F" />
      <stop offset="100%" stop-color="#C85A3F" />
    </linearGradient>

    <!-- Subtle Premium Radial Ambient Light -->
    <radialGradient id="ambient-light" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#E07A5F" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Minimal Inner Card Plate -->
    <linearGradient id="plate-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#212838" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#151A26" stop-opacity="0.85" />
    </linearGradient>

    <!-- Drop Shadow for Precision Geometries -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="glow-symbol" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. Master Canvas Container (iOS / Android Smooth Squircle) -->
  <rect width="512" height="512" rx="118" fill="url(#bg-grad)" />
  <rect width="512" height="512" rx="118" fill="url(#ambient-light)" />
  <!-- Elegant Micro-Border Rim -->
  <rect x="2.5" y="2.5" width="507" height="507" rx="116" fill="none" stroke="rgba(255, 255, 255, 0.09)" stroke-width="3" />

  <!-- 2. Minimalist Precision FinTech Vault Shield / Plate -->
  <g filter="url(#soft-shadow)">
    <!-- Base Plate -->
    <rect x="88" y="88" width="336" height="336" rx="48" fill="url(#plate-grad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
    
    <!-- Top Geometric Hairline Accent -->
    <path d="M 136 89 L 376 89" stroke="url(#emerald-glow)" stroke-width="3.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- 3. Dynamic Precision Upward Metric Trend Bar (Top Right) -->
  <g transform="translate(322, 126)">
    <circle cx="28" cy="28" r="24" fill="rgba(224, 122, 95, 0.12)" stroke="rgba(224, 122, 95, 0.25)" stroke-width="1.5" />
    <path d="M 18 36 L 28 22 L 38 22 M 38 22 L 38 32" fill="none" stroke="url(#accent-warm)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 4. Modern Stylized Currency / Wealth Core: Clean Architectural Rupee Emblem -->
  <!-- Master crafted with mathematically balanced stroke geometry and optical proportions -->
  <g filter="url(#glow-symbol)" transform="translate(256, 258)">
    <!-- Top Primary Beam -->
    <path d="M -54 -74 L 54 -74" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
    
    <!-- Secondary Dynamic Parallel Beam -->
    <path d="M -54 -38 L 26 -38" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
    
    <!-- Vertical Spine to Precision Upper Curve -->
    <path d="M -22 -74 L -22 -6 C -22 -6 -2 -6 20 -18 C 42 -30 42 -58 20 -70 C 4 -78 -22 -78 -22 -78" 
          fill="none" stroke="url(#emerald-glow)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dynamic Diagonal Forward Growth Stroke -->
    <path d="M -8 -12 L 52 74" fill="none" stroke="url(#emerald-glow)" stroke-width="14.5" stroke-linecap="round" />
    
    <!-- Subtle Modern Counter-Dot Accent -->
    <circle cx="-22" cy="72" r="7" fill="url(#accent-warm)" />
  </g>

  <!-- 5. Minimalist Ledger Indicator Nodes at Bottom -->
  <g transform="translate(132, 386)">
    <rect x="0" y="0" width="38" height="6" rx="3" fill="url(#emerald-glow)" />
    <rect x="48" y="0" width="18" height="6" rx="3" fill="rgba(255, 255, 255, 0.25)" />
    <rect x="76" y="0" width="18" height="6" rx="3" fill="rgba(255, 255, 255, 0.12)" />
  </g>
</svg>
